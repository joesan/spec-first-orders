# Gates 2-4: the implementation.
# build:       generated interfaces compile, unit + property + architecture tests pass
# mutation:    the tests actually catch bugs (PIT, >= 80 % on the domain)
# conformance: the running service matches the contract (Schemathesis)
name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  SCHEMATHESIS_VERSION: '4.31.1'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Generate API code, compile, run tests
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - name: Upload application jar
        uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: target/orders-service-*.jar
          retention-days: 1

  mutation:
    name: Mutation testing (PIT)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run PIT on the domain package
        run: mvn -B -ntp -Pmutation verify
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pit-report
          path: target/pit-reports/

  conformance:
    name: Contract conformance (Schemathesis)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: app
      - name: Start the service
        run: |
          jars=(app/orders-service-*.jar)
          nohup java -jar "${jars[0]}" > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/orders?limit=1" > /dev/null; then
              echo "Service is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Service did not start within 60 s"
          cat app.log
          exit 1
      - name: Install Schemathesis
        run: pip install "schemathesis==${SCHEMATHESIS_VERSION}"
      - name: Test the running service against api/openapi.yaml
        run: |
          st run api/openapi.yaml \
            --url http://localhost:8080 \
            --checks all \
            --phases examples,coverage,fuzzing,stateful \
            --max-examples 100 \
            --report junit,html \
            --report-dir schemathesis-report
      - name: Upload Schemathesis report and service log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: schemathesis-report
          path: |
            schemathesis-report/
            app.log
